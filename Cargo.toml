[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["coding-lanes contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
coding-lanes-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
