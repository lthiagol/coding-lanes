[package]
name = "coding-lanes-raul"
description = "Review, Approve, Understand Lane — the TUI of coding-lanes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "raul"
path = "src/main.rs"

[dependencies]
coding-lanes-core.workspace = true
anyhow.workspace = true
crossterm.workspace = true
# `Paragraph::line_count` asks ratatui how tall a paragraph will be, so the
# Overview measures its text the way ratatui draws it.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
serde_json.workspace = true
